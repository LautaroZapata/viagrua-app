name: Backup

# Respaldo tecnico diario de la base de produccion.
#
# Corre en GitHub Actions y no en Vercel Cron a proposito: el dump lo hace
# pg_dump, un binario que el runtime de Vercel no incluye y que ademas tendria
# que terminar dentro del limite de una funcion. El runner de Ubuntu ya trae
# postgresql-client y no tiene ese techo.
#
# Secrets que hay que cargar en Settings > Secrets and variables > Actions:
#
#   SUPABASE_DB_URL            Cadena de conexion del "Session pooler", no la
#                              directa. La directa (db.<ref>.supabase.co) hoy
#                              resuelve solo a IPv6 y los runners de GitHub son
#                              IPv4, asi que falla con "network unreachable".
#                              Se copia de Supabase > Project Settings >
#                              Database > Connection string > Session pooler.
#   SUPABASE_URL               https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  Project Settings > API > service_role.
#
# Restaurar: bajar el .tar.gz del bucket, descomprimir y aplicar en orden
# roles.sql, schema.sql, data.sql y triggers.sql sobre un proyecto vacio.
#
#   psql "$URL_DESTINO" -f roles.sql
#   psql "$URL_DESTINO" -f schema.sql
#   psql "$URL_DESTINO" -f data.sql
#   psql "$URL_DESTINO" -f triggers.sql
#
# triggers.sql va ultimo porque los triggers referencian funciones de public
# que crea schema.sql.

on:
  schedule:
    # 06:00 UTC = 03:00 en Argentina. De madrugada para no competir con el uso
    # real de la app.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Dos backups a la vez escribirian el mismo nombre de archivo y podarian sobre
# una lista desactualizada.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: Volcar la base al bucket privado
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # El CLI de Supabase envuelve a pg_dump con las particularidades del
      # servicio: se saltea los schemas internos que no se pueden restaurar y
      # separa roles, schema y datos en tres archivos que se aplican en orden.
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Volcar roles, schema y datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Falta el secret SUPABASE_DB_URL." >&2
            exit 1
          fi
          mkdir -p dump
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f dump/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f dump/data.sql

          # `supabase db dump` vuelca el schema public y NO trae los triggers
          # que viven sobre otros schemas. El mas importante es
          # on_auth_user_created, sobre auth.users: sin el, un restore da una
          # aplicacion donde el alta crea el usuario y la empresa pero no el
          # perfil, sin mostrar ningun error. Se descubrio con los E2E.
          #
          # Se vuelcan todos los triggers no internos de auth y storage, no solo
          # ese, para que agregar uno nuevo no vuelva a dejar el backup corto.
          psql "$SUPABASE_DB_URL" -tAc "
            select pg_get_triggerdef(t.oid) || ';'
            from pg_trigger t
            join pg_class c on c.oid = t.tgrelid
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname in ('auth', 'storage')
              and not t.tgisinternal
            order by 1;
          " > dump/triggers.sql

      # Un dump vacio que se sube sin chistar es peor que un backup que falla:
      # el workflow queda en verde y el respaldo no sirve. Recien se descubre el
      # dia que hay que restaurar.
      - name: Verificar que el dump no venga vacio
        run: |
          set -euo pipefail
          for f in dump/roles.sql dump/schema.sql dump/data.sql; do
            [ -s "$f" ] || { echo "$f quedo vacio." >&2; exit 1; }
          done
          grep -q 'CREATE TABLE' dump/schema.sql || {
            echo "schema.sql no tiene ni un CREATE TABLE." >&2; exit 1; }
          grep -q '^COPY ' dump/data.sql || {
            echo "data.sql no tiene ni un COPY: la base salio sin datos." >&2; exit 1; }
          # Este es el que faltaba y no se notaba: sin el trigger que crea el
          # perfil, la app restaurada no puede dar de alta a nadie.
          grep -q 'on_auth_user_created' dump/triggers.sql || {
            echo "triggers.sql no tiene on_auth_user_created." >&2; exit 1; }
          echo "Dump verificado:"
          wc -c dump/*.sql

      - name: Comprimir
        run: |
          set -euo pipefail
          ARCHIVO="viagrua-$(date -u +%F).tar.gz"
          tar -czf "$ARCHIVO" -C dump roles.sql schema.sql data.sql triggers.sql
          echo "ARCHIVO=$ARCHIVO" >> "$GITHUB_ENV"

          # El plan actual de Supabase corta en 50 MB por archivo. Pasado ese
          # techo la subida falla y el dia queda sin backup, asi que conviene
          # enterarse mientras todavia sobra margen y no el dia que revienta.
          BYTES=$(stat -c%s "$ARCHIVO")
          echo "$ARCHIVO: $((BYTES / 1024)) KB"
          if [ "$BYTES" -gt 41943040 ]; then
            echo "::warning::El backup va por $((BYTES / 1048576)) MB y el techo del plan es 50 MB. Hay que subir de plan o partir el dump."
          fi

      - name: Subir al bucket y podar los vencidos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETENCION_DIAS: '30'
        run: node scripts/backup-storage.mjs "$ARCHIVO"

      # El dump de la base no incluye los archivos del storage, solo las filas
      # que los describen. Sin este paso, restaurar deja cada traslado con sus
      # fotos listadas y ningun archivo detras.
      #
      # Va despues del dump y no antes: si el bucket de fotos llegara a fallar,
      # el backup de la base ya esta arriba.
      - name: Respaldar las fotos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-fotos.mjs
